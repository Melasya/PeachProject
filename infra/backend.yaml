AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Peach backend on AWS Lambda: the FastAPI app in a container image, served over
  HTTPS by a Lambda function URL, with Postgres on Aurora Serverless v2 that
  pauses to zero ACUs when idle. Deployed by scripts/deploy-backend.sh, which
  builds and pushes the image first - the ECR repository lives outside this
  stack because the function cannot be created until an image exists.

  Idle, this costs Aurora storage and nothing else: Lambda bills per request,
  and the cluster pauses after SecondsUntilAutoPause without connections. The
  first request after a pause waits roughly 15 seconds for it to resume.

  No custom domain: the API is served on the function URL's own HTTPS name.
  Only the frontend takes a custom domain.

Parameters:
  ProjectName:
    Type: String
    Default: peach
    Description: Prefix for every resource name, and the project tag.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that holds the function's network interfaces and the database.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Two or more subnets, in different AZs, for the function and the database.
      The function needs no internet access - it only talks to the database -
      so the default VPC's subnets do without a NAT gateway.

  ImageUri:
    Type: String
    Description: Fully qualified image, e.g. <account>.dkr.ecr.<region>.amazonaws.com/peach-backend:abc1234

  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: arm64 (Graviton) is cheaper per GB-second and builds natively on Apple Silicon.

  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: MB. CPU is allocated in proportion, so this also sets the speed.

  TimeoutSeconds:
    Type: Number
    Default: 30
    MinValue: 3
    MaxValue: 900
    Description: >-
      Leaves room for Aurora to resume from a pause (about 15 seconds).

  DbName:
    Type: String
    Default: peach

  DbUsername:
    Type: String
    Default: peach

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >-
      Generated and remembered by the deploy script. RDS forbids /, ", @ and
      spaces here, which also keeps the composed connection URL safe to use raw.

  DbEngineVersion:
    Type: String
    Default: "17.4"
    Description: >-
      Aurora PostgreSQL version. Scaling to zero needs 17.4+, 16.3+, 15.7+,
      14.12+ or 13.15+.

  DbMinCapacity:
    Type: Number
    Default: 0
    MinValue: 0
    Description: ACUs. 0 lets the cluster pause when nothing is connected.

  DbMaxCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    Description: ACUs. The ceiling on what a traffic spike can cost.

  DbSecondsUntilAutoPause:
    Type: Number
    Default: 300
    MinValue: 300
    MaxValue: 86400
    Description: Idle time, with no connections, before the cluster pauses.

  DbBackupRetentionDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 35

  AppEnv:
    Type: String
    Default: production
    AllowedValues: [development, test, production]

  LogLevel:
    Type: String
    Default: info

  CorsOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated browser origins; set this to the deployed frontend URL.

  LogRetentionDays:
    Type: Number
    Default: 7
    Description: CloudWatch gives 5 GB of ingestion and storage free each month.

Resources:
  # --- networking ---------------------------------------------------------

  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} backend function"
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-backend-function"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} database"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Postgres, from the function only
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref FunctionSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- database -----------------------------------------------------------

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} database"
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # A starter database: one serverless instance, never reachable from the
  # internet, and torn down with the stack. Turn on DeletionProtection before
  # this holds anything you would miss.
  DbCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Sub "${ProjectName}-db"
      Engine: aurora-postgresql
      EngineVersion: !Ref DbEngineVersion
      DatabaseName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds: [!Ref DbSecurityGroup]
      StorageEncrypted: true
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      CopyTagsToSnapshot: true
      DeletionProtection: false
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref DbMinCapacity
        MaxCapacity: !Ref DbMaxCapacity
        SecondsUntilAutoPause: !Ref DbSecondsUntilAutoPause
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db-1"
      DBClusterIdentifier: !Ref DbCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: false
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Kept for people and tools: the deploy script reads the password back from
  # here, so it stays stable across deploys. The function does not read it - it
  # has no route to Secrets Manager without a NAT gateway or a paid endpoint -
  # and gets the same string as an environment variable instead.
  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/backend/database-url"
      Description: !Sub "SQLAlchemy async connection string for ${ProjectName}"
      SecretString: !Sub
        - "postgresql+asyncpg://${DbUsername}:${DbPassword}@${Endpoint}:${Port}/${DbName}"
        - Endpoint: !GetAtt DbCluster.Endpoint.Address
          Port: !GetAtt DbCluster.Endpoint.Port
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- function -----------------------------------------------------------

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Logs, plus the network interfaces a function in a VPC needs.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-backend"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Function:
    Type: AWS::Lambda::Function
    # Aurora has to have an instance before a request can use the cluster.
    DependsOn: DbInstance
    Properties:
      FunctionName: !Sub "${ProjectName}-backend"
      Description: !Sub "${ProjectName} FastAPI backend"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [!Ref Architecture]
      MemorySize: !Ref MemorySize
      Timeout: !Ref TimeoutSeconds
      Role: !GetAtt ExecutionRole.Arn
      LoggingConfig:
        LogGroup: !Ref LogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref FunctionSecurityGroup]
      Environment:
        Variables:
          APP_ENV: !Ref AppEnv
          LOG_LEVEL: !Ref LogLevel
          CORS_ORIGINS: !Ref CorsOrigins
          # No pool: warm but idle environments would keep connections open,
          # and Aurora only pauses once there are none.
          DB_POOLING: "false"
          DATABASE_URL: !Sub
            - "postgresql+asyncpg://${DbUsername}:${DbPassword}@${Endpoint}:${Port}/${DbName}"
            - Endpoint: !GetAtt DbCluster.Endpoint.Address
              Port: !GetAtt DbCluster.Endpoint.Port
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # HTTPS out of the box, on AWS's certificate. CORS is left to the app, since
  # configuring it here too would send every header twice.
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Function
      AuthType: NONE

  # A public function URL needs both grants: InvokeFunctionUrl, and
  # InvokeFunction limited to calls that came through the URL.
  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Description: Base URL of the backend, with no trailing slash.
    Value: !Sub
      - "https://${Host}"
      - Host: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]

  FunctionName:
    Value: !Ref Function

  DatabaseEndpoint:
    Value: !GetAtt DbCluster.Endpoint.Address

  DatabaseUrlSecretArn:
    Value: !Ref DatabaseUrlSecret

  LogGroupName:
    Value: !Ref LogGroup
