# Development overrides: bind-mounted source, hot reload, dev dependencies.
# Compose loads this automatically; skip it in CI/production with
#   docker compose -f docker-compose.yml up
services:
  backend:
    build:
      target: dev
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level ${LOG_LEVEL:-info}"
    environment:
      APP_ENV: development
    volumes:
      - ./backend:/app
      # keep the image's virtualenv from being shadowed by the host mount
      - backend_venv:/app/.venv

  frontend:
    build:
      target: dev
    command: pnpm dev
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  backend_venv:
  frontend_node_modules:
  frontend_next:
