name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Also run by deploy.yml as the gate before a deploy.
  workflow_call:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The tests create and drop their own peach_test database on this server.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: peach
          POSTGRES_PASSWORD: peach
          POSTGRES_DB: peach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peach -d peach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://peach:peach@localhost:5432/peach
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: vitest
        run: pnpm test
